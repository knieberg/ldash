# User creation template — copy to ~/.config/ldash/templates/user_samba_posix.yaml
# Adjust object_classes to match your directory. Many Samba trees use account
# instead of (or in addition to) inetOrgPerson — see user_samba_account.example.yaml.
name: samba_posix_user
description: POSIX + inetOrgPerson + sambaSamAccount user entry (example)

object_classes:
  - inetOrgPerson
  - posixAccount
  - sambaSamAccount

defaults:
  login_shell: "/bin/bash"
  home_prefix: "/home"

required_attributes:
  - uid
  - cn
  - sn
  - uidNumber
  - gidNumber
  - homeDirectory
  - loginShell

optional_attributes:
  - givenName
  - mail
  - gecos

custom_attributes:
  - name: title
    label: Job title
    help: Role shown in address books (LDAP title)
    required: false

create_primary_group: true
