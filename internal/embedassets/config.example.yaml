# Example only — copy to ~/.config/ldash/config.yaml and customize.
# Run: ldash config init

server:
  url: "ldap://ldap.example.com:389"
  tls_mode: starttls # plain | starttls | ldaps

base_dn: "dc=example,dc=com"
bind_dn: "cn=admin,dc=example,dc=com"

organizational_units:
  people: "ou=People"
  groups: "ou=Groups"

id_ranges:
  uid_start: 10000
  gid_start: 10000

# Match filters to your directory schema (see docs/configuration.md).
# Samba-only trees often use posixAccount (and may omit inetOrgPerson).
search:
  user_filter: "(&(|(objectClass=inetOrgPerson)(objectClass=posixAccount))(uid=%s))"
  group_filter: "(objectClass=posixGroup)"
  list_users_filter: "(|(objectClass=inetOrgPerson)(objectClass=posixAccount))"

# Samba SID = domain_sid + "-" + (uidNumber * 2 + 1000). Replace with your domain SID locally.
samba:
  domain_sid: "S-1-5-21-1000000000-2000000000-3000000000"

templates_dir: "~/.config/ldash/templates"

# Credentials: use ~/.config/ldash/credentials (mode 0600) or prompt on start.
# credential_file: "~/.config/ldash/credentials"
